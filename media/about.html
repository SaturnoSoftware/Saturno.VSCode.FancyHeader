<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}}; img-src {{cspSource}} data:; font-src {{cspSource}};"
  />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>About {{extensionName}}</title>
</head>
<body>
  <main>
    <h1>{{extensionName}}</h1>
    <p>Configurable file headers for Visual Studio Code.</p>
    <div class="meta">
      <div class="version">Version {{extensionVersion}}</div>
      <div class="build">Build {{extensionBuild}}</div>
    </div>
  </main>
</body>
</html>
